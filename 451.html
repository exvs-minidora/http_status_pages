<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>451 Unavailable For Legal Reasons</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #f5f5f5;
      overflow: hidden;
      background: linear-gradient(135deg, #120607 0%, #1d0b0d 48%, #050505 100%);
    }

    .status-page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 48px 24px;
      position: relative;
      overflow: hidden;
    }

    .status-page::before {
      content: "";
      position: absolute;
      inset: -20%;
      background:
        radial-gradient(circle at 25% 20%, rgba(255, 40, 40, 0.2), transparent 32%),
        radial-gradient(circle at 80% 80%, rgba(255, 255, 255, 0.05), transparent 30%);
      filter: blur(20px);
      pointer-events: none;
    }

    .card {
      width: min(920px, 100%);
      min-height: 540px;
      border: 1px solid rgba(255, 70, 70, 0.2);
      background: rgba(40, 8, 10, 0.58);
      backdrop-filter: blur(24px);
      border-radius: 28px;
      padding: 44px;
      position: relative;
      box-shadow: 0 30px 100px rgba(0,0,0,0.45);
      overflow: hidden;
      z-index: 1;
    }

    .card::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, transparent, rgba(255,255,255,0.035), transparent);
      transform: translateX(-100%);
      animation: scan 4s infinite;
      pointer-events: none;
    }

    .label {
      position: absolute;
      top: 32px;
      right: 36px;
      color: rgba(255,255,255,0.42);
      font-size: 13px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .code {
      font-size: clamp(72px, 14vw, 156px);
      line-height: 0.85;
      letter-spacing: -0.08em;
      font-weight: 850;
    }

    .title {
      margin-top: 24px;
      font-size: clamp(28px, 5vw, 56px);
      letter-spacing: -0.05em;
      font-weight: 750;
    }

    .copy {
      margin-top: 16px;
      max-width: 560px;
      color: rgba(255,255,255,0.68);
      font-size: 18px;
      line-height: 1.75;
    }

    .redacted {
      margin-top: 44px;
      display: grid;
      gap: 14px;
      max-width: 620px;
    }

    .bar {
      height: 24px;
      background: #050505;
      border-radius: 3px;
      box-shadow: 0 0 24px rgba(255, 0, 0, 0.08);
    }

    .bar:nth-child(1) {
      width: 92%;
    }

    .bar:nth-child(2) {
      width: 64%;
    }

    .bar:nth-child(3) {
      width: 78%;
    }

    .bar:nth-child(4) {
      width: 48%;
    }

    .seal {
      position: absolute;
      right: 48px;
      bottom: 42px;
      width: 160px;
      height: 160px;
      border-radius: 50%;
      border: 2px solid rgba(255,80,80,0.32);
      display: grid;
      place-items: center;
      color: rgba(255,100,100,0.55);
      font-weight: 900;
      letter-spacing: 0.16em;
      transform: rotate(14deg);
    }

    .seal::before {
      content: "";
      position: absolute;
      inset: 14px;
      border-radius: 50%;
      border: 1px solid rgba(255,80,80,0.22);
    }

    @keyframes scan {
      0% {
        transform: translateX(-100%);
      }

      45%, 100% {
        transform: translateX(100%);
      }
    }

    @media (max-width: 720px) {
      body {
        overflow: auto;
      }

      .card {
        padding: 32px;
        min-height: 560px;
      }

      .label {
        position: static;
        margin-bottom: 36px;
      }

      .seal {
        opacity: 0.35;
      }
    }
  </style>
</head>

<body>
  <main class="status-page">
    <section class="card">
      <div class="label">HTTP STATUS</div>

      <div class="code">451</div>
      <h1 class="title">Unavailable For Legal Reasons</h1>

      <p class="copy">
        The content is not missing. It is present, named, and deliberately withheld.
        Access ends where authority begins.
      </p>

      <div class="redacted">
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
      </div>

      <div class="seal">DENIED</div>
    </section>
  </main>
</body>
</html>
