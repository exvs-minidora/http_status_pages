<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>103 Early Hints</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #f5f5f5;
      overflow: hidden;
      background: linear-gradient(135deg, #050711 0%, #10162f 48%, #061c22 100%);
    }

    .status-page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 48px 24px;
      position: relative;
      overflow: hidden;
    }

    .status-page::before {
      content: "";
      position: absolute;
      inset: -20%;
      background:
        radial-gradient(circle at 25% 20%, rgba(122, 162, 255, 0.22), transparent 32%),
        radial-gradient(circle at 80% 80%, rgba(120, 255, 230, 0.12), transparent 30%);
      filter: blur(20px);
      pointer-events: none;
    }

    .card {
      width: min(920px, 100%);
      min-height: 540px;
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.055);
      backdrop-filter: blur(24px);
      border-radius: 28px;
      padding: 44px;
      position: relative;
      box-shadow: 0 30px 100px rgba(0,0,0,0.45);
      overflow: hidden;
      z-index: 1;
    }

    .label {
      position: absolute;
      top: 32px;
      right: 36px;
      color: rgba(255,255,255,0.42);
      font-size: 13px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .code {
      font-size: clamp(72px, 14vw, 156px);
      line-height: 0.85;
      letter-spacing: -0.08em;
      font-weight: 850;
    }

    .title {
      margin-top: 24px;
      font-size: clamp(28px, 5vw, 56px);
      letter-spacing: -0.05em;
      font-weight: 750;
    }

    .copy {
      margin-top: 16px;
      max-width: 560px;
      color: rgba(255,255,255,0.68);
      font-size: 18px;
      line-height: 1.75;
    }

    .trail {
      position: absolute;
      right: 90px;
      top: 140px;
      width: 360px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(144, 217, 255, 0.8), transparent);
      transform: rotate(-22deg);
    }

    .hint {
      position: absolute;
      border: 1px solid rgba(152, 206, 255, 0.28);
      background: rgba(152, 206, 255, 0.075);
      border-radius: 16px;
      animation: pulse 2.4s infinite ease-in-out;
    }

    .hint-a {
      width: 220px;
      height: 70px;
      right: 90px;
      bottom: 160px;
    }

    .hint-b {
      width: 150px;
      height: 150px;
      right: 270px;
      bottom: 82px;
      animation-delay: 0.35s;
    }

    .hint-c {
      width: 320px;
      height: 20px;
      left: 46px;
      bottom: 72px;
      animation-delay: 0.7s;
    }

    .hint::before {
      content: "";
      position: absolute;
      inset: 12px;
      border-radius: 10px;
      background: linear-gradient(90deg, rgba(255,255,255,0.14), transparent);
      opacity: 0.7;
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 0.35;
        transform: translateY(0);
      }

      50% {
        opacity: 0.95;
        transform: translateY(-8px);
      }
    }

    @media (max-width: 720px) {
      body {
        overflow: auto;
      }

      .card {
        padding: 32px;
        min-height: 560px;
      }

      .label {
        position: static;
        margin-bottom: 36px;
      }

      .trail {
        opacity: 0.35;
      }
    }
  </style>
</head>

<body>
  <main class="status-page">
    <section class="card">
      <div class="label">HTTP STATUS</div>

      <div class="code">103</div>
      <h1 class="title">Early Hints</h1>

      <p class="copy">
        The response has not arrived yet. Only its shadow reaches you first:
        links, traces, and fragments of a page still becoming real.
      </p>

      <div class="trail"></div>
      <div class="hint hint-a"></div>
      <div class="hint hint-b"></div>
      <div class="hint hint-c"></div>
    </section>
  </main>
</body>
</html>
